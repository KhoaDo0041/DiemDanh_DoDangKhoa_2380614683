# Chạy: docker compose up -d --build
# API: http://localhost:5080/api/health   (Swagger: đặt ASPNETCORE_ENVIRONMENT=Development)
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-DiemDanh@2380614683}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build: ./DiemDanh_DoDangKhoa_2380614683_API
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=DiemDanhDB_DoDangKhoa_2380614683;User Id=sa;Password=${SA_PASSWORD:-DiemDanh@2380614683};TrustServerCertificate=True"
      JWTKey__Secret: ${JWT_SECRET:-DiemDanh_DoDangKhoa_2380614683_SuperLongSecretKey_ForJWT_HS256!}
      Email__User: ${EMAIL_USER:-}
      Email__AppPassword: ${EMAIL_APP_PASSWORD:-}
    restart: unless-stopped

volumes:
  sqldata:
