# Chạy: docker compose up -d --build
# API: http://localhost:5080/api/health   (Swagger: đặt ASPNETCORE_ENVIRONMENT=Development)
# Dùng Supabase thay cho db trên máy: đặt DB_CONNECTION trong file .env cạnh file này
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: DiemDanhDB_DoDangKhoa_2380614683
    ports:
      - "5432:5432"   # để chạy API bằng Visual Studio (F5) cũng kết nối được
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION:-Host=db;Port=5432;Database=DiemDanhDB_DoDangKhoa_2380614683;Username=postgres;Password=postgres}
      JWTKey__Secret: ${JWT_SECRET:-DiemDanh_DoDangKhoa_2380614683_SuperLongSecretKey_ForJWT_HS256!}
      Email__User: ${EMAIL_USER:-}
      Email__AppPassword: ${EMAIL_APP_PASSWORD:-}
    restart: unless-stopped

volumes:
  pgdata:
